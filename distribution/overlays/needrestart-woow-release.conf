# Backup jobs are finite transactions, not restartable daemons. Replaying a
# run-job command cannot resume a job that was terminated during export/restore.
# Each new job already loads the current system libraries. Exclude only these
# transient jobs; keep normal Ubuntu security updates and daemon handling.
push @{$nrconf{blacklist_rc}}, qr(^woowtech-backup-j[0-9TZ]+-[a-f0-9]+\.service$);
