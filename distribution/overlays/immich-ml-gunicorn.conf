# Optional existing-device workaround for Immich 2.7.5 / Gunicorn 25.1.0.
# Install as immich-machine-learning.container.d/90-woow-gunicorn-control.conf
# only after checking that no existing GUNICORN_CMD_ARGS would be overwritten.
# Immich remains excluded from the fresh-device profile.
[Container]
Environment=GUNICORN_CMD_ARGS=--no-control-socket
