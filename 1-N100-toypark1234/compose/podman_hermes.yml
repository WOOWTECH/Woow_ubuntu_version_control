version: "3.8"

networks:
  hermes-net:
    name: hermes-net
    external: true

volumes:
  hermes-data:
    name: hermes-data
    external: true
  hermes-workspace:
    name: hermes-workspace
    external: true

services:
  hermes-webui:
    image: localhost/hermes-webui-bundled:latest
    container_name: hermes-webui
    restart: unless-stopped
    networks:
      - hermes-net
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - hermes-data:/home/hermeswebui/.hermes
      - hermes-workspace:/workspace
    environment:
      - WANTED_UID=1000
      - WANTED_GID=1000
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_WEBUI_PASSWORD=lemon0116
      - HERMES_WEBUI_AUTO_INSTALL=1
      - TZ=Asia/Taipei
